{% extends "base.html" %}

{% block title %}Message Sent - LearnHub{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto bg-white p-8 rounded border border-gray-200 text-center shadow-sm">
    <div class="w-12 h-12 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4 text-xl font-bold">
        ✓
    </div>

    <h1 class="text-2xl font-bold text-gray-900 mb-2">
        Message Sent Successfully!
    </h1>
    <p class="text-gray-600 text-sm mb-6">
        Thank you for contacting LearnHub. We have received your message and will reply as soon as possible.
    </p>

    <div class="flex justify-center gap-3">
        <a
            href="{% url 'home' %}"
            class="bg-blue-600 text-white text-sm font-medium px-4 py-2 rounded hover:bg-blue-700 transition"
        >
            Back to Home
        </a>
        <a
            href="{% url 'contact' %}"
            class="border border-gray-300 text-gray-700 text-sm font-medium px-4 py-2 rounded hover:bg-gray-50 transition"
        >
            Send Another Message
        </a>
    </div>
</div>
{% endblock %}
